<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Welcome to Green Power!</h1>
    <p>Total Current: <span id="total-current">Waiting for data!</span></p>

    <script>
      console.log("Connecting to WebSocket...");
      const params = new URLSearchParams(window.location.search);
      const token =
        params.get("token") ||
        localStorage.getItem("access_token") ||
        localStorage.getItem("token");
      const ws_scheme = window.location.protocol === "https" ? "wss" : "ws";

      const wsUrl = token
        ? `${ws_scheme}://${window.location.host}/ws/realtime/?token=${encodeURIComponent(
            token
          )}`
        : `${ws_scheme}://${window.location.host}/ws/realtime/`;

      if (!token) {
        document.getElementById("total-current").textContent =
          "Auth token missing";
      }

      const ws = new WebSocket(wsUrl);
      ws.onopen = () => console.log("WebSocket connection established.");
      ws.onclose = () => {
        if (!token) {
          console.warn("WebSocket closed: missing auth token.");
        }
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Received data:", data);

        if (data.topic && data.topic === "MQTT_RT_DATA") {
          const ia = Number(data.payload.ia ?? 0);
          const ib = Number(data.payload.ib ?? 0);
          const ic = Number(data.payload.ic ?? 0);
          const totalCurrent = ia + ib + ic;
          document.getElementById(
            "total-current"
          ).textContent = `${totalCurrent.toFixed(3)} A`;
        }
      };
    </script>
  </body>
</html>
